<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review The Original Buscemi's</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121110">
  <link rel="icon" type="image/png" sizes="144x144" href="/assets/favicon.png">
  <style>
    body { margin: 0; font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif; background: #121110; color: #F3EDE4;
           display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 2rem; }
    .box img { width: 90px; margin: 0 auto 1rem; display: block; }
    h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
    p { margin: 0 0 1rem; color: #CFC7BC; }
    a { color: #F2B733; font-weight: 700; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo-shield.png" alt="The Original Buscemi's">
    <h1>Taking you to Google reviews&hellip;</h1>
    <p>If nothing happens, <a id="go" href="https://g.page/r/CWoLPfAMYAl9EBM/review">tap here to continue</a>.</p>
  </div>
  <script>
    setTimeout(function () { location.replace(document.getElementById('go').href); }, 400);
  </script>
  <!-- Cloudflare Web Analytics, loaded only for real visitors on the live site.
       Skipped for automated browsers, known crawlers, local previews, and any device
       that has opened the site once with ?nocount=1 (undo with ?nocount=0). -->
  <script>
  (function () {
    function shouldCount(ua, webdriver, host, flag) {
      if (webdriver) return false;
      ua = String(ua || '').replace(/cubot/ig, '');
      if (/bot|crawl|spider|slurp|headless|phantom|selenium|puppeteer|playwright|lighthouse|pagespeed|python|curl|wget|scrapy|gptbot|claudebot|claude\/|perplexity|bytespider|ccbot|applebot|facebookexternalhit/i.test(ua)) return false;
      if (host !== 'buscemisofutica.com' && host !== 'www.buscemisofutica.com') return false;
      if (flag === '1') return false;
      return true;
    }
    window.buscemisShouldCount = shouldCount;
    var flag = null, consumed = false, params = null;
    try {
      params = new URLSearchParams(location.search);
      var q = params.get('nocount');
      var ownLink = !document.referrer || /^https?:\/\/(www\.)?buscemisofutica\.com(\/|$)/.test(document.referrer);
      if (q !== null && ownLink) {
        if (q === '1') localStorage.setItem('buscemis-nocount', '1');
        if (q === '0') localStorage.removeItem('buscemis-nocount');
        consumed = true;
      }
    } catch (e) {}
    try { flag = localStorage.getItem('buscemis-nocount'); } catch (e) {}
    try {
      if (consumed) {
        params.delete('nocount');
        var rest = params.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
      }
    } catch (e) {}
    try {
      if (!shouldCount(navigator.userAgent, !!navigator.webdriver, location.hostname, flag)) return;
      var s = document.createElement('script');
      s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
      s.defer = true;
      s.setAttribute('data-cf-beacon', '{"token": "3487a82a831f48ae997ac0cc13119242"}');
      document.body.appendChild(s);
    } catch (e) {}
  })();
  </script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
